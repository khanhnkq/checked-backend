server:
  port: 8080

locket:
  app:
    jwtSecret: ${JWT_SECRET:dGVzdC1qd3Qtc2VjcmV0LXRlc3Qtand0LXNlY3JldC10ZXN0LWp3dC1zZWNyZXQ=}
    jwtExpirationMs: ${JWT_EXPIRATION_MS:86400000} # 24 giờ
  mail:
    from: ${MAIL_FROM:${MAIL_USERNAME:dev@locketclone.com}}

app:
  friend-invite:
    base-url: ${FRIEND_INVITE_BASE_URL:https://192.168.1.143/friend/accept}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173}

storage:
  type: ${STORAGE_TYPE:garage}
  s3:
    endpoint: ${GARAGE_ENDPOINT:http://localhost:3900}
    public-base-url: ${GARAGE_PUBLIC_BASE_URL:http://localhost:3902/locket-photos}
    access-key-id: ${GARAGE_ACCESS_KEY_ID:GK000000000000000000000001}
    secret-access-key: ${GARAGE_SECRET_ACCESS_KEY:0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef}
    bucket-name: ${GARAGE_BUCKET:locket-photos}
    region: ${GARAGE_REGION:garage}

cloudinary:
  cloud-name: ${CLOUDINARY_CLOUD_NAME:}
  api-key: ${CLOUDINARY_API_KEY:}
  api-secret: ${CLOUDINARY_API_SECRET:}

spring:
  application:
    name: locket-clone-api
  main:
    lazy-initialization: ${SPRING_LAZY_INIT:true}
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/locket_clone}
    username: ${DB_USER:postgres}
    password: ${DB_PASS:postgres}
    driver-class-name: org.postgresql.Driver
  docker:
    compose:
      enabled: ${SPRING_DOCKER_COMPOSE_ENABLED:false}
  devtools:
    restart:
      enabled: ${SPRING_DEVTOOLS_RESTART_ENABLED:false}
  mail:
    host: ${MAIL_HOST:}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: ${MAIL_SMTP_AUTH:true}
          starttls:
            enable: ${MAIL_SMTP_STARTTLS_ENABLE:true}
            required: ${MAIL_SMTP_STARTTLS_REQUIRED:true}
          connectiontimeout: ${MAIL_SMTP_CONNECTION_TIMEOUT:5000}
          timeout: ${MAIL_SMTP_TIMEOUT:5000}
          writetimeout: ${MAIL_SMTP_WRITE_TIMEOUT:5000}

  jpa:
    show-sql: ${JPA_SHOW_SQL:false}
    properties:
      hibernate:
        format_sql: ${JPA_FORMAT_SQL:false}
    hibernate:
      ddl-auto: validate

  flyway:
    enabled: true
    baseline-on-migrate: true

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

logging:
  level:
    org.hibernate.SQL: ${LOG_SQL_LEVEL:WARN}
    org.hibernate.orm.jdbc.bind: ${LOG_SQL_BIND_LEVEL:WARN}

springdoc:
  api-docs:
    path: /v3/api-docs
    enabled: true
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: alpha
    doc-expansion: none
