server:
  port: ${PORT:8080}

locket:
  app:
    jwtSecret: ${JWT_SECRET}
    jwtExpirationMs: ${JWT_EXPIRATION_MS:86400000} # 24 giờ
  mail:
    from: ${MAIL_FROM:${MAIL_USERNAME:dev@locketclone.com}}

app:
  friend-invite:
    base-url: ${FRIEND_INVITE_BASE_URL:https://heroku-7usd-5a73e86b5b14.herokuapp.com/invite}
  profile-base-url: ${APP_PROFILE_BASE_URL:https://heroku-7usd-5a73e86b5b14.herokuapp.com/u/}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173}
  rate-limit:
    enabled: ${RATE_LIMIT_ENABLED:true}
    register-capacity: ${RATE_LIMIT_REGISTER_CAPACITY:3}
    verify-capacity: ${RATE_LIMIT_VERIFY_CAPACITY:5}
    login-capacity: ${RATE_LIMIT_LOGIN_CAPACITY:10}
  websocket:
    heartbeat-incoming-ms: ${WS_HEARTBEAT_INCOMING_MS:10000}
    heartbeat-outgoing-ms: ${WS_HEARTBEAT_OUTGOING_MS:10000}
  chat:
    default-page-size: ${CHAT_DEFAULT_PAGE_SIZE:30}
    max-page-size: ${CHAT_MAX_PAGE_SIZE:50}
    revoke-time-limit-minutes: ${CHAT_REVOKE_TIME_LIMIT_MINUTES:60}

storage:
  type: ${STORAGE_TYPE:garage}
  s3:
    endpoint: ${GARAGE_ENDPOINT:http://localhost:3900}
    public-base-url: ${GARAGE_PUBLIC_BASE_URL:http://localhost:3902/locket-photos}
    access-key-id: ${GARAGE_ACCESS_KEY_ID:GK000000000000000000000001}
    secret-access-key: ${GARAGE_SECRET_ACCESS_KEY:0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef}
    bucket-name: ${GARAGE_BUCKET:locket-photos}
    region: ${GARAGE_REGION:garage}
  appwrite:
    endpoint: ${APPWRITE_ENDPOINT:https://fra.cloud.appwrite.io/v1}
    project-id: ${APPWRITE_PROJECT_ID:backend-storage-hub}
    bucket-id: ${APPWRITE_BUCKET_ID:checked-storage}
    api-key: ${APPWRITE_API_KEY:}

cloudinary:
  cloud-name: ${CLOUDINARY_CLOUD_NAME:}
  api-key: ${CLOUDINARY_API_KEY:}
  api-secret: ${CLOUDINARY_API_SECRET:}

spring:
  application:
    name: locket-clone-api
  main:
    lazy-initialization: ${SPRING_LAZY_INIT:false}
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/locket_clone}
    username: ${DB_USER:postgres}
    password: ${DB_PASS:postgres}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:10}
      minimum-idle: ${DB_MIN_IDLE:2}
      idle-timeout: 300000
      max-lifetime: 600000
      connection-timeout: 30000
  mongodb:
    uri: ${SPRING_MONGODB_URI:${SPRING_DATA_MONGODB_URI:${MONGODB_URI:mongodb://localhost:27017/checked_chat}}}
    uuid-representation: standard
    representation:
      uuid: standard
  data:
    mongodb:
      uri: ${SPRING_MONGODB_URI:${SPRING_DATA_MONGODB_URI:${MONGODB_URI:mongodb://localhost:27017/checked_chat}}}
      auto-index-creation: ${MONGODB_AUTO_INDEX_CREATION:true}
      uuid-representation: standard
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      ssl:
        enabled: ${REDIS_SSL:false}
      timeout: ${REDIS_TIMEOUT_MS:5000ms}
      lettuce:
        pool:
          max-active: ${REDIS_POOL_MAX_ACTIVE:8}
          max-idle: ${REDIS_POOL_MAX_IDLE:8}
          min-idle: ${REDIS_POOL_MIN_IDLE:2}
          max-wait: 2000ms
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME:guest}
    password: ${RABBITMQ_PASSWORD:guest}
    virtual-host: ${RABBITMQ_VIRTUAL_HOST:/}
    ssl:
      enabled: ${RABBITMQ_SSL:false}
    connection-timeout: 5000ms
    listener:
      simple:
        default-requeue-rejected: false
        retry:
          enabled: true
          initial-interval: 1000ms
          max-attempts: 3
          multiplier: 2.0
          max-interval: 5000ms
  docker:
    compose:
      enabled: ${SPRING_DOCKER_COMPOSE_ENABLED:false}
  devtools:
    restart:
      enabled: ${SPRING_DEVTOOLS_RESTART_ENABLED:false}
  mail:
    host: ${MAIL_HOST:}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: ${MAIL_SMTP_AUTH:true}
          starttls:
            enable: ${MAIL_SMTP_STARTTLS_ENABLE:true}
            required: ${MAIL_SMTP_STARTTLS_REQUIRED:true}
          connectiontimeout: ${MAIL_SMTP_CONNECTION_TIMEOUT:5000}
          timeout: ${MAIL_SMTP_TIMEOUT:5000}
          writetimeout: ${MAIL_SMTP_WRITE_TIMEOUT:5000}

  jpa:
    open-in-view: false
    show-sql: ${JPA_SHOW_SQL:false}
    properties:
      hibernate:
        format_sql: ${JPA_FORMAT_SQL:false}
        jdbc:
          batch_size: 25
        order_inserts: true
        order_updates: true
        default_batch_fetch_size: 30
    hibernate:
      ddl-auto: validate

  flyway:
    enabled: true
    baseline-on-migrate: true
    baseline-version: 0

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

logging:
  level:
    org.hibernate.SQL: ${LOG_SQL_LEVEL:WARN}
    org.hibernate.orm.jdbc.bind: ${LOG_SQL_BIND_LEVEL:WARN}

springdoc:
  api-docs:
    path: /v3/api-docs
    enabled: true
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: alpha
    doc-expansion: none
