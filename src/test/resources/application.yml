spring:
  datasource:
    url: jdbc:h2:mem:locket-clone-test;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
  flyway:
    enabled: false
  mongodb:
    uri: ${SPRING_MONGODB_URI:${SPRING_DATA_MONGODB_URI:${MONGODB_URI:mongodb://localhost:27017/checked_chat}}}
    uuid-representation: standard
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      ssl:
        enabled: ${REDIS_SSL:false}
      timeout: 5000ms
    mongodb:
      uri: ${SPRING_MONGODB_URI:${SPRING_DATA_MONGODB_URI:${MONGODB_URI:mongodb://localhost:27017/checked_chat}}}
      auto-index-creation: ${MONGODB_AUTO_INDEX_CREATION:false}
      uuid-representation: standard
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME:guest}
    password: ${RABBITMQ_PASSWORD:guest}
    virtual-host: ${RABBITMQ_VIRTUAL_HOST:/}
    ssl:
      enabled: ${RABBITMQ_SSL:false}

storage:
  type: garage
  s3:
    endpoint: http://localhost:3900
    public-base-url: http://localhost:3902/locket-photos
    access-key-id: test-key-id
    secret-access-key: test-secret-key
    bucket-name: test-bucket
    region: garage

cloudinary:
  cloud-name: test-cloud
  api-key: test-key
  api-secret: test-secret

locket:
  app:
    jwtSecret: dGVzdC1qd3Qtc2VjcmV0LXRlc3Qtand0LXNlY3JldC10ZXN0LWp3dC1zZWNyZXQ=
    jwtExpirationMs: 3600000

app:
  rate-limit:
    enabled: true
    register-capacity: 3
    verify-capacity: 5
    login-capacity: 10
